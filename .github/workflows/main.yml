  # ============================================================
  # PART 3 — MVC Web Front-End validation
  # ============================================================
  validate-part3:
    runs-on: ubuntu-latest
    needs: validate-part1
    # Part 3 does NOT need Part 2 to pass — it validates the web layer
    # independently, so a broken API check doesn't block web validation.

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # 1) Locate the MVC web project
    # ------------------------------------------------------------
    - name: Locate Web Project (.csproj with Sdk.Web)
      id: web
      run: |
        WEB_PROJ=""
        for f in $(find . -name "*.csproj" -not -path '*/.git/*'); do
          if grep -q 'Sdk="Microsoft.NET.Sdk.Web"' "$f"; then
            WEB_PROJ="$f"
            break
          fi
        done

        if [ -z "$WEB_PROJ" ]; then
          echo "❌ No Microsoft.NET.Sdk.Web project found (RaceDay.Web missing)"
          exit 1
        fi
        echo "✅ Found web project: $WEB_PROJ"
        echo "proj=$WEB_PROJ" >> "$GITHUB_OUTPUT"
        echo "dir=$(dirname "$WEB_PROJ")" >> "$GITHUB_OUTPUT"

    - name: Verify Web Project Structure
      run: |
        WEB_DIR="${{ steps.web.outputs.dir }}"
        echo "Checking $WEB_DIR"

        for d in "Controllers" "Models" "Services" "Views"; do
          if [ -d "$WEB_DIR/$d" ]; then
            echo "✅ $d folder present in web project"
          else
            echo "❌ $d folder missing in web project"
            exit 1
          fi
        done

    # ------------------------------------------------------------
    # 2) Session / auth wiring in Program.cs
    # ------------------------------------------------------------
    - name: Verify Web Program.cs Session & HttpClient Wiring
      run: |
        P="${{ steps.web.outputs.dir }}/Program.cs"
        if [ ! -f "$P" ]; then
          echo "❌ Web Program.cs not found at $P"
          exit 1
        fi

        for token in "AddSession" "UseSession" "AddHttpContextAccessor" "AddHttpClient" "AddControllersWithViews"; do
          if grep -q "$token" "$P"; then
            echo "✅ Program.cs has '$token'"
          else
            echo "❌ Program.cs missing '$token'"
            exit 1
          fi
        done

    - name: Verify Web Session Cookie Is HttpOnly & Essential
      run: |
        P="${{ steps.web.outputs.dir }}/Program.cs"
        if grep -q "Cookie.HttpOnly" "$P" && grep -q "Cookie.IsEssential" "$P"; then
          echo "✅ Session cookie HttpOnly + IsEssential configured"
        else
          echo "❌ Session cookie HttpOnly / IsEssential not configured"
          exit 1
        fi

    - name: Verify ApiSettings BaseUrl in appsettings.json
      run: |
        SETTINGS="${{ steps.web.outputs.dir }}/appsettings.json"
        if [ ! -f "$SETTINGS" ]; then
          echo "❌ Web appsettings.json not found"
          exit 1
        fi
        if grep -qi '"ApiSettings"' "$SETTINGS" && grep -qi '"BaseUrl"' "$SETTINGS"; then
          echo "✅ ApiSettings:BaseUrl present"
        else
          echo "❌ ApiSettings:BaseUrl missing — web app can't reach the API"
          exit 1
        fi

    # ------------------------------------------------------------
    # 3) API client service + role normalisation
    # ------------------------------------------------------------
    - name: Verify ApiService Exists
      run: |
        API=$(find "${{ steps.web.outputs.dir }}" -name "ApiService.cs" | head -1)
        if [ -z "$API" ]; then
          echo "❌ ApiService.cs not found in web project"
          exit 1
        fi
        echo "✅ ApiService.cs found: $API"

        for method in "LoginAsync" "RegisterAsync" "GetEventsAsync" "EnrolAsync"; do
          if grep -q "$method" "$API"; then
            echo "✅ ApiService has '$method'"
          else
            echo "❌ ApiService missing '$method'"
            exit 1
          fi
        done

    - name: Verify Role Normalisation (Organiser vs Organizer)
      run: |
        # This is the fix for the "everyone lands on Participant page" bug.
        WEB_DIR="${{ steps.web.outputs.dir }}"
        if grep -rE "NormalizeRole|Organi[sz]er" --include="*.cs" "$WEB_DIR" | grep -q .; then
          echo "✅ Role normalisation / Organiser handling present"
        else
          echo "❌ No Organiser role handling found — login will default everyone to Participant"
          exit 1
        fi

        if grep -rE "GetString\(\"Role\"\)|SetString\(\"Role\"" --include="*.cs" "$WEB_DIR" | grep -q .; then
          echo "✅ Session Role key read/write present"
        else
          echo "❌ Session Role key not used — role-based redirect will fail"
          exit 1
        fi

    # ------------------------------------------------------------
    # 4) Role-based navigation & controllers
    # ------------------------------------------------------------
    - name: Verify RoleAuthorize Filter
      run: |
        F=$(find "${{ steps.web.outputs.dir }}" -name "RoleAuthorizeAttribute.cs" | head -1)
        if [ -z "$F" ]; then
          echo "❌ RoleAuthorizeAttribute.cs not found"
          exit 1
        fi
        echo "✅ RoleAuthorizeAttribute.cs found"

        if grep -q "IAuthorizationFilter" "$F"; then
          echo "✅ Implements IAuthorizationFilter"
        else
          echo "❌ Does not implement IAuthorizationFilter"
          exit 1
        fi

    - name: Verify Organiser & Participant Controllers
      run: |
        WEB_DIR="${{ steps.web.outputs.dir }}"

        ORG=$(find "$WEB_DIR" -name "OrganiserController.cs" | head -1)
        PART=$(find "$WEB_DIR" -name "ParticipantController.cs" | head -1)
        ACC=$(find "$WEB_DIR" -name "AccountController.cs" | head -1)

        [ -z "$ORG" ]  && { echo "❌ OrganiserController.cs missing";  exit 1; } || echo "✅ OrganiserController.cs found"
        [ -z "$PART" ] && { echo "❌ ParticipantController.cs missing"; exit 1; } || echo "✅ ParticipantController.cs found"
        [ -z "$ACC" ]  && { echo "❌ AccountController.cs missing";     exit 1; } || echo "✅ AccountController.cs found"

        # Organiser must be gated by the filter
        if grep -q 'RoleAuthorize("Organiser")' "$ORG"; then
          echo "✅ OrganiserController protected by RoleAuthorize"
        else
          echo "❌ OrganiserController missing [RoleAuthorize(\"Organiser\")]"
          exit 1
        fi

        if grep -q 'RoleAuthorize("Participant")' "$PART"; then
          echo "✅ ParticipantController protected by RoleAuthorize"
        else
          echo "❌ ParticipantController missing [RoleAuthorize(\"Participant\")]"
          exit 1
        fi

        # Account must redirect by role
        if grep -qiE "RedirectByRole|RedirectToAction\(\"Dashboard\",\s*\"Organiser\"" "$ACC"; then
          echo "✅ AccountController routes Organiser after login"
        else
          echo "❌ AccountController does not redirect Organisers — 'all users land on Participant' bug is back"
          exit 1
        fi

    - name: Verify Login Redirect Targets Organiser Dashboard
      run: |
        WEB_DIR="${{ steps.web.outputs.dir }}"
        if grep -rE 'RedirectToAction\(\s*"Dashboard"\s*,\s*"Organiser"' --include="*.cs" "$WEB_DIR" | grep -q .; then
          echo "✅ Somewhere we redirect to Organiser/Dashboard after login"
        else
          echo "❌ No redirect to Organiser/Dashboard found — Organiser login will go to Participant page"
          exit 1
        fi

    # ------------------------------------------------------------
    # 5) Views presence
    # ------------------------------------------------------------
    - name: Verify Key Views Present
      run: |
        WEB_DIR="${{ steps.web.outputs.dir }}"
        REQUIRED_VIEWS=(
          "Views/Account/Login.cshtml"
          "Views/Account/Register.cshtml"
          "Views/Organiser/Dashboard.cshtml"
          "Views/Organiser/Events.cshtml"
          "Views/Organiser/Categories.cshtml"
          "Views/Organiser/Enrolments.cshtml"
          "Views/Organiser/Results.cshtml"
          "Views/Participant/Index.cshtml"
          "Views/Participant/EventDetails.cshtml"
          "Views/Participant/MyEnrolments.cshtml"
          "Views/Participant/MyResults.cshtml"
          "Views/Participant/Profile.cshtml"
        )
        MISSING=0
        for v in "${REQUIRED_VIEWS[@]}"; do
          if [ -f "$WEB_DIR/$v" ]; then
            echo "✅ $v"
          else
            echo "❌ $v missing"
            MISSING=1
          fi
        done
        [ $MISSING -eq 0 ] || { echo "❌ One or more required views missing"; exit 1; }

    # ------------------------------------------------------------
    # 6) Docker / containerisation (POE requirement)
    # ------------------------------------------------------------
    - name: Verify Dockerfile Present
      run: |
        WEB_DIR="${{ steps.web.outputs.dir }}"
        if [ -f "$WEB_DIR/Dockerfile" ]; then
          echo "✅ Web Dockerfile present"
          # Basic sanity: must be multi-stage aspnet + sdk
          if grep -qi "mcr.microsoft.com/dotnet/aspnet" "$WEB_DIR/Dockerfile" \
             && grep -qi "mcr.microsoft.com/dotnet/sdk"   "$WEB_DIR/Dockerfile"; then
            echo "✅ Dockerfile uses multi-stage aspnet + sdk images"
          else
            echo "⚠️ Dockerfile is missing standard aspnet/sdk base images"
          fi
        else
          echo "❌ Web Dockerfile missing (required by POE)"
          exit 1
        fi

    # ------------------------------------------------------------
    # 7) Build the web project
    # ------------------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Web Project
      run: dotnet restore "${{ steps.web.outputs.proj }}"

    - name: Build Web Project
      run: dotnet build "${{ steps.web.outputs.proj }}" --no-restore --configuration Release --nologo --verbosity minimal

    # ------------------------------------------------------------
    # 8) Summary
    # ------------------------------------------------------------
    - name: Part 3 Summary
      run: |
        echo "=================================================="
        echo " PART 3 — MVC WEB FRONT-END VALIDATION COMPLETE"
        echo "=================================================="
        echo "✔ Web project located (Sdk.Web)"
        echo "✔ Program.cs: Session + HttpClient + MVC wired"
        echo "✔ ApiSettings:BaseUrl configured"
        echo "✔ ApiService + NormalizeRole present"
        echo "✔ RoleAuthorize filter + Organiser/Participant controllers"
        echo "✔ AccountController redirects by role (Organiser fix verified)"
        echo "✔ All required Views present"
        echo "✔ Dockerfile present"
        echo "✔ Web project restores and builds"
        echo "=================================================="
