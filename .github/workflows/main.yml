name: Validate Documentation Structure

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # PART 1 — Existing documentation structure checks
  # ============================================================
  validate-part1:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Docs Folder Exists
      run: |
        if [ -d "docs" ]; then
          echo "✅ /docs folder exists"
        else
          echo "❌ /docs folder not found"
          exit 1
        fi

    - name: Verify ERD File
      run: |
        if find docs -type f \( -name "*.png" -o -name "*.pdf" \) | grep -q "."; then
          echo "✅ ERD file found (PNG or PDF)"
        else
          echo "❌ ERD file not found in /docs"
          exit 1
        fi

    - name: Verify API Endpoint Plan
      run: |
        if find docs -type f \( -name "*.md" -o -name "*.pdf" \) | grep -i "endpoint\|api" | grep -q "."; then
          echo "✅ API Endpoint Plan found"
        else
          echo "❌ API Endpoint Plan not found in /docs"
          exit 1
        fi

    - name: Verify SQL Script
      run: |
        if find docs -type f -name "*.sql" | grep -q "."; then
          echo "✅ SQL Script found"
        else
          echo "❌ SQL Script not found in /docs"
          exit 1
        fi

    - name: Verify README.md Exists
      run: |
        if [ -f "README.md" ]; then
          echo "✅ README.md exists"

          if grep -q "system" README.md || grep -q "RaceDay" README.md; then
            echo "✅ System description found"
          else
            echo "⚠️ Consider adding a system description to README.md"
          fi

          if grep -q "Organiser" README.md && grep -q "Participant" README.md; then
            echo "✅ Role descriptions found"
          else
            echo "⚠️ Consider adding role descriptions to README.md"
          fi
        else
          echo "❌ README.md not found"
          exit 1
        fi

    - name: Count Commits (Optional Check)
      run: |
        echo "Total commits in this branch:"
        git rev-list --count HEAD

    - name: Display Repository Structure
      run: |
        echo "Repository Structure:"
        tree -L 2 || ls -la

    - name: Validate SQL Syntax (Basic)
      run: |
        if find docs -name "*.sql" -exec grep -l "CREATE TABLE" {} \; | grep -q "."; then
          echo "✅ CREATE TABLE statements found in SQL script"
        else
          echo "❌ No CREATE TABLE statements found"
          exit 1
        fi

        if find docs -name "*.sql" -exec grep -l "INSERT INTO" {} \; | grep -q "."; then
          echo "✅ INSERT statements found in SQL script"
        else
          echo "⚠️ No INSERT statements found (seed data may be missing)"
        fi

  # ============================================================
  # PART 2 — New checks
  # ============================================================
  validate-part2:
    runs-on: ubuntu-latest
    needs: validate-part1

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # 1) Source folder structure
    # ------------------------------------------------------------
    - name: Verify Solution / Project Files Exist
      run: |
        echo "Looking for .sln and .csproj files..."
        SLN_COUNT=$(find . -maxdepth 2 -name "*.sln" | wc -l)
        CSPROJ_COUNT=$(find . -maxdepth 3 -name "*.csproj" | wc -l)

        if [ "$SLN_COUNT" -eq 0 ]; then
          echo "❌ No .sln file found"
          exit 1
        else
          echo "✅ Solution file(s) found: $SLN_COUNT"
        fi

        if [ "$CSPROJ_COUNT" -eq 0 ]; then
          echo "❌ No .csproj file found"
          exit 1
        else
          echo "✅ Project file(s) found: $CSPROJ_COUNT"
        fi

    - name: Verify Controllers Folder
      run: |
        if [ -d "Controllers" ] || find . -type d -name "Controllers" | grep -q "."; then
          echo "✅ Controllers folder found"
          find . -type d -name "Controllers" -exec ls -1 {} \;
        else
          echo "❌ Controllers folder not found"
          exit 1
        fi

    - name: Verify Models Folder
      run: |
        if [ -d "Models" ] || find . -type d -name "Models" | grep -q "."; then
          echo "✅ Models folder found"
        else
          echo "❌ Models folder not found"
          exit 1
        fi

    - name: Verify Data / DbContext Folder
      run: |
        if find . -type f -name "*DbContext*.cs" | grep -q "."; then
          echo "✅ DbContext file found"
        else
          echo "❌ DbContext file not found"
          exit 1
        fi

    - name: Verify Services Folder
      run: |
        if find . -type d -name "Services" | grep -q "."; then
          echo "✅ Services folder found"
        else
          echo "⚠️ Services folder not found (TokenService may be missing)"
        fi

    # ------------------------------------------------------------
    # 2) Controller coverage — required endpoints
    # ------------------------------------------------------------
    - name: Verify AuthController Endpoints
      run: |
        AUTH=$(find . -name "AuthController.cs")
        if [ -z "$AUTH" ]; then
          echo "❌ AuthController.cs not found"
          exit 1
        fi

        for route in "register" "login"; do
          if grep -q "\"$route\"" $AUTH; then
            echo "✅ AuthController has '$route'"
          else
            echo "❌ AuthController missing '$route'"
            exit 1
          fi
        done

    - name: Verify EventsController Endpoints
      run: |
        EV=$(find . -name "EventsController.cs")
        if [ -z "$EV" ]; then echo "❌ EventsController.cs not found"; exit 1; fi

        for verb in "HttpPost" "HttpGet" "HttpPut"; do
          if grep -q "$verb" $EV; then
            echo "✅ EventsController has $verb"
          else
            echo "❌ EventsController missing $verb"
            exit 1
          fi
        done

    - name: Verify CategoriesController Endpoints
      run: |
        CAT=$(find . -name "CategoriesController.cs")
        if [ -z "$CAT" ]; then echo "❌ CategoriesController.cs not found"; exit 1; fi

        for verb in "HttpPost" "HttpGet" "HttpPut"; do
          if grep -q "$verb" $CAT; then
            echo "✅ CategoriesController has $verb"
          else
            echo "❌ CategoriesController missing $verb"
            exit 1
          fi
        done

    - name: Verify EnrolmentsController Endpoints
      run: |
        EN=$(find . -name "EnrolmentsController.cs")
        if [ -z "$EN" ]; then echo "❌ EnrolmentsController.cs not found"; exit 1; fi

        for verb in "HttpPost" "HttpGet" "HttpPut" "HttpDelete"; do
          if grep -q "$verb" $EN; then
            echo "✅ EnrolmentsController has $verb"
          else
            echo "❌ EnrolmentsController missing $verb"
            exit 1
          fi
        done

    - name: Verify ResultsController Endpoints
      run: |
        RS=$(find . -name "ResultsController.cs")
        if [ -z "$RS" ]; then echo "❌ ResultsController.cs not found"; exit 1; fi

        for verb in "HttpPost" "HttpGet" "HttpPut" "HttpDelete"; do
          if grep -q "$verb" $RS; then
            echo "✅ ResultsController has $verb"
          else
            echo "❌ ResultsController missing $verb"
            exit 1
          fi
        done

    - name: Verify UsersController Endpoints
      run: |
        US=$(find . -name "UsersController.cs")
        if [ -z "$US" ]; then echo "❌ UsersController.cs not found"; exit 1; fi

        for verb in "HttpPut" "HttpGet" "HttpDelete"; do
          if grep -q "$verb" $US; then
            echo "✅ UsersController has $verb"
          else
            echo "❌ UsersController missing $verb"
            exit 1
          fi
        done

    # ------------------------------------------------------------
    # 3) Authorization / JWT checks
    # ------------------------------------------------------------
    - name: Verify JWT / Authorize Usage
      run: |
        if grep -r "Authorize(Roles" --include="*.cs" . | grep -q "."; then
          echo "✅ Role-based [Authorize] attributes found"
          grep -rn "Authorize(Roles" --include="*.cs" . | head -20
        else
          echo "⚠️ No role-based [Authorize] attributes found"
        fi

        if grep -r "TokenService" --include="*.cs" . | grep -q "."; then
          echo "✅ TokenService referenced"
        else
          echo "❌ TokenService not referenced"
          exit 1
        fi

    - name: Verify JWT Configuration Present
      run: |
        APPSETTINGS=$(find . -name "appsettings.json" | head -1)
        if [ -z "$APPSETTINGS" ]; then
          echo "❌ appsettings.json not found"
          exit 1
        fi

        for key in "Jwt" "Issuer" "Audience" "Key"; do
          if grep -q "$key" $APPSETTINGS; then
            echo "✅ appsettings.json has '$key'"
          else
            echo "❌ appsettings.json missing '$key'"
            exit 1
          fi
        done

    - name: Verify Program.cs JWT Wiring
      run: |
        P=$(find . -name "Program.cs" | head -1)
        if [ -z "$P" ]; then echo "❌ Program.cs not found"; exit 1; fi

        for token in "AddAuthentication" "AddJwtBearer" "UseAuthentication" "UseAuthorization"; do
          if grep -q "$token" $P; then
            echo "✅ Program.cs has '$token'"
          else
            echo "❌ Program.cs missing '$token'"
            exit 1
          fi
        done

    # ------------------------------------------------------------
    # 4) SQL schema consistency checks
    # ------------------------------------------------------------
    - name: Verify Required Tables Present in SQL
      run: |
        SQL=$(find docs -name "*.sql" | head -1)
        if [ -z "$SQL" ]; then echo "❌ SQL file not found in docs/"; exit 1; fi
        echo "Checking: $SQL"

        REQUIRED="USERS ROLES ASSIGNMENT EVENTS CATEGORIES ENROLMENTS RESULTS"
        MISSING=0
        for t in $REQUIRED; do
          if grep -qi "CREATE TABLE $t" $SQL; then
            echo "✅ Table $t present"
          else
            echo "❌ Table $t missing"
            MISSING=1
          fi
        done
        [ $MISSING -eq 0 ] || exit 1

    - name: Verify No GETDATE() in CHECK Constraints
      run: |
        SQL=$(find docs -name "*.sql" | head -1)
        if grep -iE "CHECK.*GETDATE|CHECK.*DATEDIFF.*GETDATE" $SQL | grep -q "."; then
          echo "❌ Invalid CHECK constraint uses GETDATE() — SQL Server will reject this"
          grep -inE "CHECK.*GETDATE" $SQL
          exit 1
        else
          echo "✅ No illegal GETDATE() in CHECK constraints"
        fi

    - name: Verify Seed Roles Inserted
      run: |
        SQL=$(find docs -name "*.sql" | head -1)
        for role in "Participant" "Organiser"; do
          if grep -q "$role" $SQL; then
            echo "✅ Seed role '$role' present"
          else
            echo "❌ Seed role '$role' missing"
            exit 1
          fi
        done

    # ------------------------------------------------------------
    # 5) Build the .NET API
    # ------------------------------------------------------------
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore

    - name: Build Project
      run: dotnet build --no-restore --configuration Release

    # ------------------------------------------------------------
    # 6) Optional: run tests if they exist
    # ------------------------------------------------------------
    - name: Run Tests (if any)
      run: |
        if find . -name "*Tests.csproj" | grep -q "."; then
          dotnet test --no-build --configuration Release --verbosity normal
        else
          echo "ℹ️ No test projects found — skipping"
        fi

    # ------------------------------------------------------------
    # 7) Final summary
    # ------------------------------------------------------------
    - name: Part 2 Summary
      run: |
        echo "=================================================="
        echo " PART 2 VALIDATION COMPLETE"
        echo "=================================================="
        echo "✔ Source folders verified (Controllers, Models, Data)"
        echo "✔ All required controllers and verbs present"
        echo "✔ JWT auth wired (TokenService + Program.cs + appsettings)"
        echo "✔ SQL schema contains all required tables"
        echo "✔ No illegal GETDATE() checks"
        echo "✔ Seed roles present"
        echo "✔ .NET project restores and builds"
        echo "=================================================="
